services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bansal-react-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.bansal-frontend.rule=Host(`bansalclassesvizag.com`)"
      - "traefik.http.routers.bansal-frontend.entrypoints=web"
      - "traefik.http.services.bansal-frontend.loadbalancer.server.port=80"
    networks:
      - traefik_net

networks:
  traefik_net:
    name: traefik
    external: true
