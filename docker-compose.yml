services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bansal-react-frontend
    # Traefik will route traffic internally, so you don't need to expose ports to the host
    # ports:
    #   - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      # Replace 'your-domain.com' with your actual domain
      - "traefik.http.routers.bansal-frontend.rule=Host(`your-domain.com`)"
      # The port your container listens on internally (Nginx inside the React container usually uses 80)
      - "traefik.http.services.bansal-frontend.loadbalancer.server.port=80"
      
      # Optional: Uncomment below if you have HTTPS/TLS configured in Traefik
      # - "traefik.http.routers.bansal-frontend.entrypoints=websecure"
      # - "traefik.http.routers.bansal-frontend.tls.certresolver=myresolver" # Change 'myresolver' to your cert resolver name
    networks:
      - web # Change this to match your existing Traefik network name

# Define the external network so this container can communicate with Traefik
networks:
  web:
    external: true
    # name: actual_network_name_here # Uncomment if the network is named something else on your host
