services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bansal-react-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      # Tell Traefik exactly which network to use for routing
      - "traefik.docker.network=${TRAEFIK_NETWORK:-web}"
      # Using a variable for the domain. It falls back to bansalclassesvizag.com if not set.
      - "traefik.http.routers.bansal-frontend.rule=Host(`${DOMAIN:-bansalclassesvizag.com}`)"
      - "traefik.http.services.bansal-frontend.loadbalancer.server.port=80"
    networks:
      - traefik_net

networks:
  traefik_net:
    name: ${TRAEFIK_NETWORK:-web}
    external: true
